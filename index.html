    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sistema de Gestión de Afiliados</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ff5f00" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Montserrat', sans-serif;
      }
      /* Custom styles for responsive tables */
      @media (max-width: 767px) {
        .responsive-table thead {
          display: none;
        }
        .responsive-table tbody, .responsive-table tr, .responsive-table td {
          display: block;
        }
        .responsive-table tr {
          margin-bottom: 1rem;
          border-radius: 0.5rem;
          box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
          border: 1px solid #e5e7eb; /* gray-200 */
          background-color: #ffffff;
        }
        .responsive-table td {
          padding: 1rem;
          text-align: right;
          border-bottom: 1px solid #e5e7eb; /* gray-200 */
        }
        .responsive-table tr td:last-child {
          border-bottom: none;
        }
        .responsive-table td:before {
          content: attr(data-label);
          font-weight: 600;
          color: #4B5563; /* secondary color */
          float: left;
          text-align: left;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "recharts": "https://aistudiocdn.com/recharts@^3.2.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Register service worker only in production
      if ('serviceWorker' in navigator && import.meta.env.PROD) {
        window.addEventListener('load', () => {
          console.log('Intentando registrar ServiceWorker desde /service-worker.js');
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('✅ ServiceWorker registrado correctamente:', registration.scope);
            })
            .catch((error) => {
              console.error('❌ Fallo en el registro del ServiceWorker:', error);
              console.error('Error details:', error.message);
            });
        });
      } else if ('serviceWorker' in navigator && !import.meta.env.PROD) {
        console.log('ServiceWorker desactivado en modo desarrollo');
      } else {
        console.log('ServiceWorker no soportado en este navegador');
      }
    </script>
  </body>
</html>
